apiVersion: apps/v1
kind: Deployment
metadata:
  name: infradb-backend
  namespace: infradb-dev
  labels:
    app: infradb-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: infradb-backend
  template:
    metadata:
      labels:
        app: infradb-backend
    spec:
      containers:
        - name: backend
          image: infradb-assist-backend:dev
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: infradb-backend-config
          env:
            - name: INFRADB_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: infradb-backend-secret
                  key: INFRADB_DB_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            tcpSocket:
              port: 8000
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: 8000
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: infradb-backend
  namespace: infradb-dev
spec:
  type: ClusterIP
  selector:
    app: infradb-backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
