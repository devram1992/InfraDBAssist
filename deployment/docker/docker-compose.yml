services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: infradb-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: infradb
      POSTGRES_USER: infradb
      POSTGRES_PASSWORD: infradb_dev_password

    ports:
      - "5433:5432"

    volumes:
      - infradb_postgres_data:/var/lib/postgresql/data
      - ../../database/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U infradb -d infradb"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  oracle:
    image: container-registry.oracle.com/database/free:latest
    container_name: infradb-oracle
    restart: unless-stopped

    environment:
      ORACLE_PWD: ${ORACLE_PWD:?ORACLE_PWD must be set}
      ORACLE_CHARACTERSET: AL32UTF8

    ports:
      - "1521:1521"

    volumes:
      - infradb-oracle-data:/opt/oracle/oradata

volumes:

  infradb_postgres_data:

  infradb-oracle-data:
    external: true
